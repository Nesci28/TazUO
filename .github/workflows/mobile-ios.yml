name: TazUO iOS Unity build

on:
  workflow_dispatch:

jobs:
  unity-ios-project:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap MobileUO project
        run: |
          tools/mobile-ios/fetch-pyodide.sh
          tools/mobile-ios/bootstrap.sh

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: mobile-ios/build/MobileUO
          targetPlatform: iOS
          buildMethod: TazUO.Editor.BuildIOS.Perform
          unityVersion: 6000.3.24f1
          customParameters: -nographics

      - name: Upload unsigned Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: tazuo-ios-xcode
          path: mobile-ios/build/Xcode
